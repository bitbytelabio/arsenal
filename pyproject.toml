[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "arsenal-security"
dynamic = ["version"]
description = "Arsenal security analysis, evidence, case review, and reporting CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dat Nguyen <dat.nguyen@bitbytelab.io>" }]
dependencies = [
  "androguard>=4.1.4,<5",
  "jsonschema[format]>=4.23,<5",
  "markdown-it-py>=3,<5",
  "PyYAML>=6.0.2,<7",
  "ruamel.yaml>=0.18,<0.19",
  "mcp>=1.26,<2",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
]

[project.scripts]
arsenal = "arsenal.cli:main"

[project.optional-dependencies]
scripts = ["pandas>=2.2,<4", "Jinja2>=3.1.5,<4"]
mobile = ["frida>=16,<18", "frida-tools>=13,<15"]
wireless = ["bleak>=0.21,<3"]
network = ["scapy>=2.5,<3", "pyshark>=0.6,<1", "dnspython>=2.4,<3", "python-nmap>=0.7,<1"]
cloud = ["boto3>=1.34,<2", "msal>=1.28,<2", "docker>=7,<8"]
intel = ["shodan>=1.31,<2", "censys>=2.2,<3", "pymisp>=2.4,<3", "stix2>=3,<4", "taxii2-client>=2.3,<3", "attackcti>=0.4,<1", "tldextract>=5.1,<6"]
forensics = ["pefile>=2023.2.7", "yara-python>=4.5,<5", "python-evtx>=0.7,<1", "dissect>=3"]
re = ["r2pipe>=1.9,<2"]
ad = ["impacket>=0.12,<1", "ldap3>=2.9,<3"]
ai = ["transformers>=4.40,<6", "torch>=2.2,<3", "spacy>=3.7,<4", "librosa>=0.10,<1"]
analysis = ["pandas>=2.2,<4", "numpy>=1.26,<3", "Jinja2>=3.1.5,<4", "scikit-learn>=1.4,<2", "networkx>=3.2,<4", "joblib>=1.3,<2", "Levenshtein>=0.25,<1"]
crypto = ["cryptography>=46.0.6", "pyOpenSSL>=24", "python-pkcs11>=0.7,<1", "cbor2>=5.6,<6"]
vuln = ["python-gvm>=24", "requests>=2.32,<3", "urllib3>=2.2,<3", "lxml>=5.2,<7", "Pillow>=10.2,<13", "psutil>=5.9,<8", "watchdog>=4,<7"]
all = [
  "pandas>=2.2,<4", "Jinja2>=3.1.5,<4", "frida>=16,<18", "frida-tools>=13,<15",
  "bleak>=0.21,<3", "scapy>=2.5,<3", "pyshark>=0.6,<1", "dnspython>=2.4,<3",
  "python-nmap>=0.7,<1", "boto3>=1.34,<2", "msal>=1.28,<2", "docker>=7,<8",
  "shodan>=1.31,<2", "censys>=2.2,<3", "pymisp>=2.4,<3", "stix2>=3,<4",
  "taxii2-client>=2.3,<3", "attackcti>=0.4,<1", "tldextract>=5.1,<6",
  "pefile>=2023.2.7", "yara-python>=4.5,<5", "python-evtx>=0.7,<1", "dissect>=3",
  "r2pipe>=1.9,<2", "impacket>=0.12,<1", "ldap3>=2.9,<3",
  "transformers>=4.40,<6", "torch>=2.2,<3", "spacy>=3.7,<4", "librosa>=0.10,<1",
  "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "networkx>=3.2,<4", "joblib>=1.3,<2",
  "Levenshtein>=0.25,<1", "cryptography>=46.0.6", "pyOpenSSL>=24",
  "python-pkcs11>=0.7,<1", "cbor2>=5.6,<6", "python-gvm>=24",
  "requests>=2.32,<3", "urllib3>=2.2,<3", "lxml>=5.2,<7", "Pillow>=10.2,<13",
  "psutil>=5.9,<8", "watchdog>=4,<7",
]



[project.urls]
Repository = "https://github.com/bitbytelabio/arsenal"
Issues = "https://github.com/bitbytelabio/arsenal/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/arsenal"]

[tool.hatch.build.targets.sdist]
include = [
  "src/arsenal", "src/corpus", "presets", "package.json", "pyproject.toml",
  "hatch_build.py", "uv.lock", "README.md", "README.vi.md", "LICENSE",
  "plugin/agents", "plugin/rules", "plugin/commands", "plugin/context",
  "plugin/catalog", "plugin/dist", "plugin/skills", "plugin/package.json",
  "plugin/plugin.json", "plugin/.mcp.json",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
exclude = ["src/arsenal/corpus", "src/arsenal/scripts"]
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F841"]
