name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@bitbytelabio"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --locked

      - name: Validate tag matches package.json SSOT
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Tag version 'v$TAG_VERSION' does not match package.json version '$PKG_VERSION'" >&2
            exit 1
          fi

      - name: Verify typecheck
        run: bun run typecheck

      - name: Run Python test suite
        run: uv run --locked pytest

      - name: Run native Bun test suite
        run: bun test

      - name: Build plugin assets
        run: uv run --locked arsenal build --write --force

      - name: Verify build determinism
        run: uv run --locked arsenal build --check-determinism --json

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package plugin marketplace distribution
        run: uv run --locked arsenal plugin pack --write

      - name: Build Python wheel and sdist
        run: uv build --out-dir dist

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
