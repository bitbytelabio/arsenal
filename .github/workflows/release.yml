name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify typecheck
        run: bun run typecheck

      - name: Run test suite
        run: bun test

      - name: Verify build determinism
        run: bun --no-env-file run bin/arsenal.ts build --check-determinism --json

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --provenance --access public

      - name: Package plugin marketplace distribution
        run: bun --no-env-file run bin/arsenal.ts plugin pack --write

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
