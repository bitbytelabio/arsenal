name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

  audit-and-determinism:
    name: Build Determinism & Corpus Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --locked

      - name: Build plugin assets
        run: uv run --locked arsenal build --write --force

      - name: Verify build determinism
        run: uv run --locked arsenal build --check-determinism --json

      - name: Verify catalog parity
        run: uv run --locked arsenal scripts catalog/verify --json

      - name: Audit skills language
        run: uv run --locked arsenal skills check --language --json

      - name: Audit skills script references
        run: uv run --locked arsenal skills scripts-audit --json

      - name: Check domain coverage (RE)
        run: uv run --locked arsenal skills coverage --domain re --check --json

      - name: Check domain coverage (Webapp)
        run: uv run --locked arsenal skills coverage --domain webapp --check --json

      - name: Check domain coverage (Mobile)
        run: uv run --locked arsenal skills coverage --domain mobile --check --json

      - name: Check domain coverage (Red Team)
        run: uv run --locked arsenal skills coverage --domain red --check --json

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --locked

      - name: Run Python test suite
        run: uv run --locked pytest

      - name: Run native Bun test suite
        run: bun test
